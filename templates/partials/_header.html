<header class="header">
  <div class="header__brand">
    <div class="header__text-group">
      <div class="header__title-row">
        <h1 class="header__title">Análisis Estadístico Descriptivo</h1>
        <span class="header__badge">Data Studio v2.4</span>
      </div>
      <p class="header__subtitle">Medidas de centralidad, variabilidad y modelado de covarianzas</p>
    </div>
  </div>

  <div class="header__actions">
    <button id="btnResetData" class="header__theme-btn" type="button" title="Borrar datos guardados">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"/>
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
      </svg>
      <span>Nuevo</span>
    </button>
    
    <button id="themeToggle" class="header__theme-btn" type="button" aria-label="Cambiar tema">
      <svg class="header__theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
      <span class="header__theme-label">Tema</span>
    </button>
  </div>
</header>
